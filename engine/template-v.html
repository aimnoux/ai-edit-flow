<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="lib/tokens.css" />
    <link rel="stylesheet" href="lib/style.css" />
    <link rel="stylesheet" href="lib/vertical.css" />
    <script>window.addEventListener("error", (e) => { document.documentElement.dataset.err = (document.documentElement.dataset.err || "") + e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno + " | "; });</script>
    <script src="lib/vendor/gsap.min.js"></script>
  </head>
  <body>
    <!-- Generated by vertical.py from template-v.html: edit the template or the scene, not this file -->
    <div id="root" data-composition-id="{{ID}}" data-start="0" data-duration="{{DUR}}" data-fps="25" data-width="1080" data-height="1920">
      <div id="world" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">{{WORLD}}</div>
      <div id="stage" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="1"></div>
      <div id="hud" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="2"></div>
      <div id="overlay" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="3">{{OVERLAY}}</div>
    </div>
    <script type="application/json" id="cues">[]</script>
    <script>window.TIMING = {{TIMING}};</script>
    <script src="lib/kit.js"></script>
    <script src="lib/vertical.js"></script>
    {{EXTRA}}
    <script src="{{SCENE}}"></script>
    <script>liveCaptions(); platformEnding();</script>
    <script src="lib/finish.js"></script>
  </body>
</html>
